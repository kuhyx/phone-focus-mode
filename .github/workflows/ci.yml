name: CI

# In testsAndMisc these suites were discovered by shell-tests.yml's glob over
# */lib/tests/run_all.sh. That discovery does not follow the code out, so the
# repo needs its own runner or the suites would silently stop being checked.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          find . -name '*.sh' -not -path './.git/*' -print0 \
            | xargs -0 shellcheck
      - name: lib tests
        run: ./lib/tests/run_all.sh
