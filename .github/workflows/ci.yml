name: CI

# One workflow for the whole merged repo. android-guardian, mtk-root and
# focus-owner each arrived with their own ci.yml; GitHub only reads workflows
# under the ROOT .github/workflows, so those nested copies stopped running the
# moment they became subdirectories. Their jobs are folded in here and the
# nested files deleted, rather than left in the tree looking like coverage that
# does not exist.
#
# Where two of the four repos gated the same thing at different strictness, the
# stricter setting wins: shellcheck runs with no --severity filter (every
# finding fails, including info and style) over the whole tree in one pass, and
# `flutter analyze` keeps --fatal-infos.
#
# Test discovery is EXPLICIT per absorbed suite, never a single glob. The root
# glob was lib/tests/test_*.sh, which matches neither mtk-root/lib/tests/ nor
# android-guardian/tests/ -- a glob that "should catch it" is how an absorbed
# suite silently stops being checked.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # One shellcheck pass over every *.sh in the merged tree. The four repos
      # each ran an identical find|xargs step, so this is their union, not a
      # loosening: .shellcheckrc at the root carries external-sources and
      # source-path=SCRIPTDIR, which resolve per-script and so serve the
      # absorbed subdirectories as well as the original ones.
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 shellcheck

      - name: shell suites (phone-focus-mode)
        # No config_secrets.sh here, by design: it is never committed. config.sh
        # tolerates its absence and the suites pin their own coordinates.
        run: |
          set -euo pipefail
          rc=0
          for t in lib/tests/test_*.sh; do
            # test_magisk_service.sh hangs rather than finishing. It did so in
            # the monorepo too (verified against the pre-extraction tree) and
            # was never in any CI list there, so this is a pre-existing gap
            # carried over knowingly, not a regression introduced by the split.
            case "$t" in */test_magisk_service.sh) echo "SKIP $t (hangs; pre-existing)"; continue ;; esac
            printf '\n=== %s ===\n' "$t"
            timeout 300 bash "$t" || rc=1
          done
          exit "$rc"

      - name: shell suites (android-guardian)
        run: |
          set -euo pipefail
          rc=0
          for t in android-guardian/tests/*.sh; do
            printf '\n=== %s ===\n' "$t"
            timeout 300 bash "$t" || rc=1
          done
          exit "$rc"

      - name: shell suites (mtk-root)
        # Its own runner, kept rather than re-globbed here: it invokes each
        # suite as a fresh process on purpose (mtk_common.sh declares readonly
        # patterns, so sourcing it twice in one shell aborts under set -e).
        run: ./mtk-root/lib/tests/run_all.sh

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest
      - name: python tests
        run: python -m pytest tests focus_policy -q

  flutter:
    # focus-owner's job, unchanged. It is the one absorbed suite that needs a
    # toolchain of its own, so it stays a separate job rather than bloating the
    # shell runner with a Flutter SDK it never uses.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: focus-owner
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "stable"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test
