name: CI

# focus_owner had no workflow in the testsAndMisc monorepo; only Dart style
# for billsplit was gated there. Extraction is the moment it gets real CI.
#
# No `dart format --set-exit-if-changed` step: the committed tree predates the
# current formatter and adding the gate would mean reformatting 15 files this
# extraction never touched. Worth doing as its own commit, not smuggled in here.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "stable"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test
